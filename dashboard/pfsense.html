<script>
const REFRESH_MS = 30000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gb = b => (b / 1073741824).toFixed(1);
const lvl = (v, w, c) => v >= c ? 'crit' : v >= w ? 'warn' : '';

async function api(p) {
  const r = await fetch('/pfs-api/' + p, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).data;
}

function uptime(s) {
  const m = String(s).match(/(\d+)\s*Day.*?(\d+)\s*Hour/i);
  return m ? m[1] + ' j ' + m[2] + ' h' : String(s);
}

function gauge(icon, title, text, pct, cls, detail) {
  return '<div class="card"><i class="fa-solid ' + icon + '"></i><h2>' + esc(title) + '</h2>' +
    '<div class="number">' + esc(text) + '</div>' +
    '<div class="progress"><span class="' + cls + '" style="width:' + Math.min(100, Math.max(0, pct)) + '%"></span></div>' +
    (detail ? '<p>' + esc(detail) + '</p>' : '') + '</div>';
}

function systemCards(s) {
  if (!s) return '<p>System unavailable.</p>';
  return '<div class="card"><i class="fa-solid fa-shield-halved"></i><h2>pfSense</h2>' +
    '<div class="vm-status"><span class="dot online-dot"></span>ONLINE</div>' +
    '<p>' + esc(s.platform || '') + '</p><p>Uptime: ' + esc(uptime(s.uptime)) + '</p></div>' +
    gauge('fa-microchip', 'CPU', s.cpu_usage.toFixed(0) + '%', s.cpu_usage, lvl(s.cpu_usage, 75, 90), s.cpu_count + ' cores') +
    gauge('fa-memory', 'RAM', s.mem_usage + '%', s.mem_usage, lvl(s.mem_usage, 75, 90), 'Swap: ' + s.swap_usage + '%') +
    gauge('fa-temperature-half', 'TEMPERATURE', s.temp_c + '°C', s.temp_c, lvl(s.temp_c, 65, 75), 'Disk: ' + s.disk_usage + '%') +
    nvmeCard();
}

// ---- NVMe disk: sent every hour to Loki by the script /root/nvme-sante.sh (syslog tag "nvmesante") ----
const NVME_REFRESH_MS = 600000;   // 10 minutes
const NVME_MAX_HEURES = 3;        // older data = cron stopped?
let nvme = null, nvmeErreur = '';

async function loadNvme() {
  try {
    const fin = Date.now() * 1e6, debut = fin - 26 * 3600 * 1e9;
    const url = '/loki-api/loki/api/v1/query_range?query=' + encodeURIComponent('{app="nvmesante"}') +
      '&start=' + debut + '&end=' + fin + '&limit=1&direction=backward';
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const v = (((j.data || {}).result || [])[0] || {}).values;
    if (!v || !v.length) { nvme = null; nvmeErreur = 'no data for 26 h'; }
    else {
      const ligne = String(v[0][1]);
      nvme = JSON.parse(ligne.slice(ligne.indexOf('{')));
      nvme.recu = Number(v[0][0]) / 1e6;
      nvmeErreur = '';
    }
  } catch (e) { nvmeErreur = e.message; }
  if (lastR) $('system').innerHTML = systemCards(lastR.system);
}

function nvmeCard() {
  const tete = '<div class="card"><i class="fa-solid fa-hard-drive"></i><h2>NVMe DISK</h2>';
  if (!nvme) return tete + '<div class="number">--</div><p>' + esc(nvmeErreur ? 'Waiting: ' + nvmeErreur : 'Loading…') + '</p><p>Script nvme-sante.sh on pfSense</p></div>';
  const n = nvme;
  let cls = lvl(n.usure_pct || 0, 70, 90);
  if (n.smart_ok === false || n.erreurs_media > 0 || n.zfs_etat !== 'ONLINE' || (n.reserve_pct !== null && n.reserve_pct <= 20)) cls = 'crit';
  else if (n.temp_c >= 70 && cls !== 'crit') cls = 'warn';
  const vieux = (Date.now() - n.recu) / 3600000 > NVME_MAX_HEURES;
  const lignes = [
    'SMART ' + (n.smart_ok ? 'OK' : 'FAILED') + ' · ' + n.temp_c + ' °C · spare ' + n.reserve_pct + ' %',
    'ZFS ' + n.zfs_etat + ' · ' + n.zfs_utilise + ' / ' + n.zfs_taille + ' (' + n.zfs_pct + ' %)',
    'Written: ' + n.ecrit_to + ' TB · ' + n.erreurs_media + ' error(s)'
  ];
  if (vieux) lignes.unshift('Data from ' + new Date(n.recu).toLocaleString('en-CA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' (cron stopped?)');
  return tete + '<div class="number">' + esc(n.usure_pct) + ' % used</div>' +
    '<div class="progress"><span class="' + (vieux && !cls ? 'warn' : cls) + '" style="width:' + Math.min(100, Math.max(2, n.usure_pct || 0)) + '%"></span></div>' +
    lignes.map(l => '<p>' + esc(l) + '</p>').join('') + '</div>';
}

// Short gateway name on the card: NORDVPN1_VPNV4 -> NORDVPN1 (display only, the gateway is not renamed in pfSense).
const nomCourtPasserelle = n => String(n || '').replace(/_VPNV[46]$/i, '');

function gatewayCards(g) {
  if (!g) return '<p>Gateways unavailable.</p>';
  return g.map(x => {
    const ok = x.status === 'online';
    const dot = ok ? (x.loss > 0 ? 'warning-dot' : 'online-dot') : 'offline-dot';
    return '<div class="card"><i class="fa-solid fa-globe"></i><h2 title="' + esc(x.name) + '">' + esc(nomCourtPasserelle(x.name)) + '</h2>' +
      '<div class="vm-status"><span class="dot ' + dot + '"></span>' + esc(String(x.status).toUpperCase()) + '</div>' +
      '<p>Latency: ' + Number(x.delay).toFixed(1) + ' ms</p><p>Loss: ' + x.loss + ' %</p></div>';
  }).join('');
}

function interfaceRows(list) {
  if (!list) return '<p>Interfaces unavailable.</p>';
  let h = '<div class="row head"><span>Interface</span><span>State</span><span>Received</span><span>Sent</span></div>';
  list.forEach(i => {
    const ok = i.status === 'up';
    h += '<div class="row"><span>' + esc(i.descr || i.name) + '</span>' +
      '<span class="vm-status"><span class="dot ' + (ok ? 'online-dot' : 'offline-dot') + '"></span>' + (ok ? 'UP' : 'DOWN') + '</span>' +
      '<span>' + gb(i.inbytes) + ' GB</span><span>' + gb(i.outbytes) + ' GB</span></div>';
  });
  return h;
}

function serviceChips(list) {
  if (!list) return '<p>Services unavailable.</p>';
  return list.map(s => {
    const ok = s.status === true || s.status === 'running';
    return '<div class="chip"><span class="dot ' + (ok ? 'online-dot' : (s.enabled ? 'offline-dot' : 'warning-dot')) + '"></span>' + esc(s.name) + '</div>';
  }).join('');
}

function firewallPanel(log, ifaces, leases) {
  if (!log) return '<p>Log unavailable.</p>';
  const hw = {};
  (ifaces || []).forEach(i => { hw[i.hwif] = i.descr || i.name; });
  const cnt = {};
  let blocks = 0, total = 0;
  log.forEach(e => {
    const t = String(e.text).split(']: ').pop().split(',');
    if (t.length < 7) return;
    total++;
    if (t[6] !== 'block') return;
    blocks++;
    const n = hw[t[4]] || t[4];
    cnt[n] = (cnt[n] || 0) + 1;
  });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const max = top.length ? top[0][1] : 1;
  let h = '<p>' + blocks + ' blocks in the last ' + total + ' log entries</p>';
  if (log.length) h += '<p>Last entry: ' + esc(String(log[0].text).slice(0, 15)) + '</p>';
  h += top.map(([n, c]) => '<div class="row" style="grid-template-columns:140px 1fr 50px"><span>' + esc(n) +
    '</span><div class="bar"><span style="width:' + Math.round(c / max * 100) + '%"></span></div><span>' + c + '</span></div>').join('');
  if (leases) h += '<p>DHCP leases: ' + leases.length + '</p>';
  return h;
}


// ---- Firewall and Snort read from Loki (Nginx relay /loki-api/, read only) ----
const LOKI_REFRESH_MS = 300000;   // 5 minutes
const GRAFANA_URL = 'http://192.168.100.15:3000/d/pfsense-loki/pfsense-pare-feu-et-snort';   // <- your Grafana dashboard
// Same thresholds as SEUIL in the n8n node check_pfsense_logs (keep them identical)
const SURV = { ports: 15, tentatives: 50, recurrente: 10, maxIp: 30 };
const LFL = '{job="syslog", app="filterlog"}';
const LSN = '{job="syslog", app="snort"}';
const LWAN = ' |= ",igc3,match,block,in,"';
const LSYN = ' |~ ",tcp,[0-9]+,[0-9.]+,[0-9.]+,[0-9]+,[0-9]+,[0-9]+,S,"';
const LRE_SYN = ' | regexp `^(?:[^,]*,){8}4,(?:[^,]*,){7}tcp,[^,]*,(?P<src>[^,]*),[^,]*,[^,]*,(?P<dport>[^,]*),[^,]*,S,`';
const LRE_IFACE = ' | regexp `^(?:[^,]*,){4}(?P<iface>[^,]*),[^,]*,(?P<action>[^,]*),`';
const LRE_SNORT = ' | regexp `\\[[0-9]+:[0-9]+:[0-9]+\\] (?P<msg>.*?) (?:\\[Classification: [^\\]]*\\] )?\\[Priority: [0-9]\\]`';

let lastR = null, lokiOk = false, lokiStarted = false, nvmeStarted = false;

async function lq(expr) {
  const r = await fetch('/loki-api/loki/api/v1/query?query=' + encodeURIComponent(expr), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.status !== 'success') throw new Error('invalid Loki response');
  return j.data.result;
}
// Ports: Loki limits to 500 series per query, so the SYN lines (24 h) are read and counted here
async function lignesSyn() {
  const fin = Date.now() * 1e6, debut = fin - 24 * 3600 * 1e9;
  const q = LFL + LWAN + LSYN;
  const url = '/loki-api/loki/api/v1/query_range?query=' + encodeURIComponent(q) + '&start=' + debut + '&end=' + fin + '&limit=5000&direction=backward';
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.status !== 'success') throw new Error('invalid Loki response');
  const parPort = {}, portsIp = {};
  (j.data.result || []).forEach(f => (f.values || []).forEach(v => {
    const c = String(v[1]).split(',');
    if (c[8] !== '4' || c[16] !== 'tcp' || !c[18] || !c[21]) return;
    parPort[c[21]] = (parPort[c[21]] || 0) + 1;
    (portsIp[c[18]] = portsIp[c[18]] || new Set()).add(c[21]);
  }));
  return { parPort, portsIp };
}
const lcount = (sel, filt, win) => 'sum(count_over_time(' + sel + filt + ' [' + win + '])) or vector(0)';
async function lnum(expr) {
  const r = await lq(expr);
  return r.length ? Math.round(Number(r[0].value[1])) : 0;
}
async function ltop(expr, key, max) {
  const r = await lq(expr);
  return r.filter(x => x.metric && x.metric[key])
    .map(x => ({ k: x.metric[key], n: Math.round(Number(x.value[1])) }))
    .sort((a, b) => b.n - a.n).slice(0, max || 5);
}

function topBox(title, icon, items, color, wide, label) {
  const max = items.length ? items[0].n : 1;
  const rows = items.length
    ? items.map(it => '<div class="trow' + (wide ? ' wide' : '') + '"><span class="tlabel" title="' + esc(it.k) + '">' +
        esc(label ? label(it.k) : it.k) + '</span><div class="bar"><span style="width:' + Math.max(4, Math.round(it.n / max * 100)) +
        '%;background:' + color + '"></span></div><span class="tcount">' + it.n.toLocaleString('en-CA') + '</span></div>').join('')
    : '<p class="tempty">No data over 24 h</p>';
  return '<div class="tbox"><h3><i class="fa-solid ' + icon + '"></i>' + esc(title) + '</h3>' + rows + '</div>';
}

function copyText(text, btn) {
  const done = () => {
    const old = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
    setTimeout(() => { btn.innerHTML = old; }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); return; }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* copy not possible */ }
  document.body.removeChild(ta);
}

function renderWatch(list) {
  if (!list.length) {
    return '<div class="watchbox ok"><div class="watchhead"><i class="fa-solid fa-shield-halved"></i><h3>Attacks to watch</h3></div>' +
      '<p class="watchsum">No external IP to watch over 24 h.</p></div>';
  }
  list.sort((a, b) => b.ports - a.ports || b.n - a.n);
  const best = list[0];
  const quoi = best.ports >= SURV.ports ? 'scanning ' + best.ports + ' different ports' : 'with ' + best.n + ' attempts';
  const sum = list.length + ' external IP' + (list.length > 1 ? 's' : '') + ' to watch, including ' + best.ip + ' ' + quoi + '.';
  const rows = list.map(x => {
    const url = 'https://www.abuseipdb.com/check/' + encodeURIComponent(x.ip);
    return '<div class="wrow"><span class="wip">' + esc(x.ip) + '</span><span>' + x.n + ' attempts</span><span>' + x.ports + ' ports</span>' +
      '<span class="wwhy" title="' + esc(x.motifs.join(' · ')) + '">' + esc(x.motifs.join(' · ')) + '</span>' +
      '<a class="wlink" href="' + url + '" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> AbuseIPDB</a></div>';
  }).join('');
  return '<div class="watchbox"><div class="watchhead"><i class="fa-solid fa-user-secret"></i><h3>Attacks to watch</h3>' +
    '<button class="gbtn wbtn" id="copyips" type="button"><i class="fa-regular fa-copy"></i> Copy the IPs</button></div>' +
    '<p class="watchsum">' + esc(sum) + '</p>' +
    '<div class="wtable"><div class="wrow whead"><span>IP address</span><span>Attempts</span><span>Ports</span><span>Why</span><span>Check</span></div>' + rows + '</div></div>';
}

function renderFirewallZone() {

// ===== History of the WAN blocks, SYN scans and Snort alerts cards (v2026.11.24-1) =====
// A click on one of these cards expands it with its history, counted in Loki (query_range, same filters as the card):
//   1 day       : 5-minute curve
//   3 days      : hourly curve
//   7, 30 days  : one bar per day (read hourly, then added up per day)
// Square-root scale (small values stay visible), the 2 biggest peaks labelled (one on a phone).
// For 1, 3 and 7 days: comparison with the same length of time just before. A click on the icon, title or number goes back to live.
// One card open at a time. Results are kept 5 minutes (switching periods does not query Loki again for nothing).
const HISTO = {
  wan:   { titre: 'WAN blocks', icone: 'fa-ban', sous: 'blocked incoming connections', sel: () => LFL + LWAN, couleur: '#ff4d4d', mot: 'blocks' },
  syn:   { titre: 'SYN scans', icone: 'fa-magnifying-glass', sous: 'TCP probes on the WAN', sel: () => LFL + LWAN + LSYN, couleur: '#ffc107', mot: 'scans' },
  snort: { titre: 'Snort alerts', icone: 'fa-triangle-exclamation', sous: 'over 24 hours', sel: () => LSN, couleur: '#ff8c42', mot: 'alerts' }
};
const LK_HEURE = 3600 * 1000, LK_JOUR = 24 * LK_HEURE;
const LK_JOURS_C = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let lkConstruites = false, lkOuverte = null, lkJours = 1, lkMinuterie = null, lkDonnees = null;
const lkCache = new Map();

const lkNb = v => Math.round(v).toLocaleString('en-CA');
const lkHm = t => { const d = new Date(t); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
const lkJourCourt = t => { const d = new Date(t); return LK_JOURS_C[d.getDay()] + ' ' + d.getDate(); };

function carteHisto(cle) {
  const c = HISTO[cle];
  return '<div class="card carte-lk" id="lk-carte-' + cle + '" data-cle="' + cle + '" role="button" tabindex="0" aria-expanded="false" title="Tap to see the history">' +
    '<i class="fa-solid ' + c.icone + '"></i><h2>' + esc(c.titre) + '</h2>' +
    '<div class="number" id="lk-val-' + cle + '">--</div><p>' + esc(c.sous) + '</p>' +
    '<p class="lk-indice">Tap for the history</p>' +
    '<div class="lk-histo" hidden>' +
      '<div class="lk-boutons">' + [1, 3, 7, 30].map(j => '<button type="button" data-jours="' + j + '">' + j + (j === 1 ? ' day' : ' days') + '</button>').join('') + '</div>' +
      '<div class="lk-graph">Loading the history…</div>' +
      '<div class="lk-info"></div><div class="lk-resume" style="--c:' + c.couleur + '"></div><div class="lk-note"></div>' +
    '</div></div>';
}

// The cards are built once; after that only the numbers change (an open history stays on screen)
function majCartesLoki(v, h1) {
  if (!lkConstruites) {
    $('loki-cards').innerHTML = carteHisto('wan') + carteHisto('syn') + carteHisto('snort') + '<div class="card" id="lk-carte-logs"></div>';
    lkConstruites = true;
    lkOuverte = null;
  }
  ['wan', 'syn', 'snort'].forEach(k => { $('lk-val-' + k).textContent = v[k].toLocaleString('en-CA'); });
  const actif = h1 > 0;
  $('lk-carte-logs').innerHTML = '<i class="fa-solid fa-database"></i><h2>Log reception</h2>' +
    '<div class="vm-status"><span class="dot ' + (actif ? 'online-dot' : 'offline-dot') + '"></span>' + (actif ? 'ACTIVE' : 'STOPPED') + '</div>' +
    '<p>' + h1.toLocaleString('en-CA') + ' logs in the last hour</p>';
}

// Points to read from Loki. At each time t, Loki counts the lines of ]t - step, t]: one point = one bucket that ENDS at t.
// Hours are aligned on the clock; 7 and 30 days start at midnight (local time) for whole days.
// 30 days = 720 hours at most: under Loki's usual limit (max_query_length of 721 h).
function planHisto(jours) {
  const now = Date.now();
  if (jours === 1) {
    const fin = Math.ceil(now / 300000) * 300;          // seconds, next 5-minute boundary
    return { pas: 300, fenetre: '5m', debut: fin - 287 * 300, fin: fin };   // 288 buckets of 5 min = 24 h
  }
  const fin = Math.ceil(now / LK_HEURE) * 3600;          // seconds, end of the current hour
  let premiereCase;
  if (jours === 3) premiereCase = fin - 72 * 3600;
  else { const m = new Date(); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - (jours - 1)); premiereCase = Math.round(m.getTime() / 1000); }
  return { pas: 3600, fenetre: '1h', debut: premiereCase + 3600, fin: fin };
}

async function lserie(expr, debut, fin, pas) {
  const url = '/loki-api/loki/api/v1/query_range?query=' + encodeURIComponent(expr) +
    '&start=' + debut + '&end=' + fin + '&step=' + pas;
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.text()).slice(0, 160); } catch (e) { /* nothing */ }
    throw new Error('HTTP ' + r.status + (detail ? ' : ' + detail : ''));
  }
  const j = await r.json();
  if (j.status !== 'success') throw new Error('invalid Loki response');
  const m = new Map();
  (j.data.result || []).forEach(s => (s.values || []).forEach(v => {
    const t = Math.round(Number(v[0]));
    m.set(t, (m.get(t) || 0) + Number(v[1]));
  }));
  return m;
}

async function chargerHisto(force) {
  const cle = lkOuverte, jours = lkJours;
  if (!cle) return;
  const carte = $('lk-carte-' + cle);
  const graph = carte.querySelector('.lk-graph');
  const k = cle + '-' + jours, enCache = lkCache.get(k);
  if (enCache && !force && Date.now() - enCache.quand < LOKI_REFRESH_MS) { lkDonnees = enCache; dessinerHisto(); return; }
  graph.textContent = jours >= 30 ? 'Loading 30 days from Loki (a few seconds)…' : 'Loading the history…';
  carte.querySelector('.lk-info').textContent = '';
  carte.querySelector('.lk-resume').innerHTML = '';
  carte.querySelector('.lk-note').textContent = '';
  try {
    const P = planHisto(jours);
    const sel = HISTO[cle].sel();
    const fen = jours * 24 + 'h';
    const [m, comp] = await Promise.all([
      lserie('sum(count_over_time(' + sel + ' [' + P.fenetre + ']))', P.debut, P.fin, P.pas),
      jours <= 7
        ? Promise.all([lnum(lcount(sel, '', fen)), lnum('sum(count_over_time(' + sel + ' [' + fen + '] offset ' + fen + ')) or vector(0)')]).catch(() => null)
        : Promise.resolve(null)
    ]);
    if (lkOuverte !== cle || lkJours !== jours) return;   // the user changed card or period in the meantime
    const maintenant = Date.now(), pts = [];
    for (let t = P.debut; t <= P.fin; t += P.pas) {
      pts.push({ t: (t - P.pas) * 1000, n: Math.round(m.get(t) || 0), enCours: t * 1000 > maintenant });
    }
    lkDonnees = { cle, jours, pas: P.pas * 1000, pts, comp, quand: Date.now() };
    lkCache.set(k, lkDonnees);
    dessinerHisto();
  } catch (e) {
    if (lkOuverte !== cle || lkJours !== jours) return;
    console.error('Loki history:', e);
    graph.textContent = 'History unavailable (' + (e.message || e) + ')' +
      (jours >= 30 ? ': the period may be longer than what Loki keeps or accepts.' : '');
  }
}

// Readable gridlines for a square-root scale (at least 26 px apart)
function lkGraduations(haut, yv) {
  const liste = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 1e4, 2e4, 5e4, 1e5, 2e5, 5e5, 1e6, 2e6, 5e6];
  const garde = [0]; let dernier = yv(0);
  liste.filter(v => v <= haut).forEach(v => { if (dernier - yv(v) >= 26) { garde.push(v); dernier = yv(v); } });
  return garde;
}
const lkAbrege = v => v >= 1e6 ? (v / 1e6).toLocaleString('en-CA') + ' M' : v >= 1e4 ? (v / 1e3).toLocaleString('en-CA') + ' k' : v.toLocaleString('en-CA');

function dessinerHisto() {
  const D0 = lkDonnees;
  if (!D0 || D0.cle !== lkOuverte || D0.jours !== lkJours) return;
  const carte = $('lk-carte-' + D0.cle), C = HISTO[D0.cle], coul = C.couleur, mot = C.mot;
  const graph = carte.querySelector('.lk-graph'), info = carte.querySelector('.lk-info');
  const resume = carte.querySelector('.lk-resume'), note = carte.querySelector('.lk-note');
  const jours = D0.jours, pas = D0.pas, barres = jours >= 7;
  const W = Math.max(300, Math.round(graph.clientWidth || 600));
  const petit = W < 560, FS = petit ? 14 : 16;
  const H = petit ? 270 : 330, G = petit ? 58 : 72, Dr = 14, Hh = 30, B = 56, bas = H - B;

  // Series to draw: Loki's buckets, or their total per day
  let serie;
  if (barres) {
    const parJour = new Map();
    D0.pts.forEach(p => {
      const d = new Date(p.t); d.setHours(0, 0, 0, 0);
      const o = parJour.get(d.getTime()) || { t: d.getTime(), n: 0 };
      o.n += p.n; parJour.set(d.getTime(), o);
    });
    serie = [...parJour.values()].sort((a, b) => a.t - b.t);
  } else serie = D0.pts;
  if (!serie.length) { graph.textContent = 'No data.'; return; }

  const debut = serie[0].t;
  const fin = barres ? serie[serie.length - 1].t + LK_JOUR : serie[serie.length - 1].t + pas;
  const xg = t => G + (t - debut) / (fin - debut) * (W - G - Dr);
  const plusHaut = Math.max(5, ...serie.map(p => p.n));
  const yv = v => bas - Math.sqrt(Math.max(0, v) / plusHaut) * (bas - Hh);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(C.titre) + ' over ' + jours + ' day(s)">';

  // Horizontal gridlines
  lkGraduations(plusHaut, yv).forEach(v => {
    s += '<line x1="' + G + '" x2="' + (W - Dr) + '" y1="' + yv(v) + '" y2="' + yv(v) + '" stroke="rgba(255,255,255,.12)"/>';
    s += '<text x="' + (G - 8) + '" y="' + (yv(v) + FS / 3) + '" text-anchor="end" font-size="' + FS + '" fill="#e8f6ff">' + lkAbrege(v) + '</text>';
  });

  let survol = [];
  if (!barres) {
    // Time axis: hours, then day name
    const intervalle = jours <= 1 ? (petit ? 6 : 3) : (petit ? 24 : 12);
    const h0 = new Date(debut); h0.setMinutes(0, 0, 0);
    if (h0.getTime() < debut) h0.setTime(h0.getTime() + LK_HEURE);
    while (h0.getHours() % intervalle !== 0) h0.setTime(h0.getTime() + LK_HEURE);
    for (let t = h0.getTime(); t <= fin; t += intervalle * LK_HEURE) {
      const d = new Date(t), minuit = d.getHours() === 0;
      s += '<line x1="' + xg(t) + '" x2="' + xg(t) + '" y1="' + Hh + '" y2="' + (bas + 6) + '" stroke="' + (minuit ? 'rgba(0,238,255,.35)' : 'rgba(255,255,255,.08)') + '"/>';
      s += '<text x="' + xg(t) + '" y="' + (bas + FS + 8) + '" text-anchor="middle" font-size="' + FS + '" fill="#e8f6ff">' + d.getHours() + ':00</text>';
    }
    const j0 = new Date(debut); j0.setHours(0, 0, 0, 0);
    for (let d = j0.getTime(); d < fin; d += LK_JOUR) {
      const a = Math.max(d, debut), b = Math.min(d + LK_JOUR, fin);
      if ((b - a) / LK_HEURE < (petit ? 7 : 4)) continue;
      s += '<text x="' + ((xg(a) + xg(b)) / 2) + '" y="' + (bas + 2 * FS + 16) + '" text-anchor="middle" font-size="' + FS + '" font-weight="700" fill="#00eaff">' + lkJourCourt(a) + '</text>';
    }

    // Curve and area (point in the middle of each bucket)
    const xm = p => xg(p.t + pas / 2);
    const ligne = serie.map((p, i) => (i ? 'L' : 'M') + xm(p).toFixed(1) + ' ' + yv(p.n).toFixed(1)).join(' ');
    const aire = 'M' + xm(serie[0]).toFixed(1) + ' ' + bas + ' ' + serie.map(p => 'L' + xm(p).toFixed(1) + ' ' + yv(p.n).toFixed(1)).join(' ') +
      ' L' + xm(serie[serie.length - 1]).toFixed(1) + ' ' + bas + ' Z';
    s += '<path d="' + aire + '" fill="' + coul + '" fill-opacity=".18"/>';
    s += '<path d="' + ligne + '" fill="none" stroke="' + coul + '" stroke-width="2"/>';

    // Text of one bucket
    const quand = p => pas === LK_HEURE
      ? lkJourCourt(p.t) + ', ' + new Date(p.t).getHours() + ':00 to ' + ((new Date(p.t).getHours() + 1) % 24) + ':00'
      : lkJourCourt(p.t) + ', ' + lkHm(p.t) + ' to ' + lkHm(p.t + pas);

    // Labels of the 2 biggest peaks (one on a phone)
    const choisies = [];
    serie.slice().sort((a, b) => b.n - a.n).forEach(p => {
      if (choisies.length < (petit ? 1 : 2) && p.n >= 1 && choisies.every(c => Math.abs(xm(c) - xm(p)) > 220)) choisies.push(p);
    });
    choisies.forEach(p => {
      const x = xm(p), y = yv(p.n);
      const txt = lkNb(p.n) + ' · ' + (pas === LK_HEURE ? lkJourCourt(p.t) + ' ' + new Date(p.t).getHours() + ':00' : lkHm(p.t));
      const ancre = x > W - 170 ? 'end' : x < G + 120 ? 'start' : 'middle';
      s += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + coul + '"/>';
      s += '<text x="' + x + '" y="' + Math.max(FS, y - 10) + '" text-anchor="' + ancre + '" font-size="' + FS + '" font-weight="700" fill="' + coul + '">' + txt + '</text>';
    });
    survol = serie.map(p => ({ x: xm(p), texte: quand(p) + ' : <b style="color:' + coul + '">' + lkNb(p.n) + ' ' + mot + '</b>' + (p.enCours ? ' (in progress)' : '') }));
  } else {
    // One bar per day
    const largeurJour = (W - G - Dr) / serie.length;
    const lb = Math.max(3, Math.min(40, largeurJour * 0.62));
    const max = serie.reduce((a, j) => j.n > a.n ? j : a, serie[0]);
    serie.forEach((j, i) => {
      const centre = xg(j.t + LK_JOUR / 2), y = yv(j.n);
      s += '<rect x="' + (centre - lb / 2) + '" y="' + y + '" width="' + lb + '" height="' + (bas - y) + '" rx="2" fill="' + coul + '"' + (i === serie.length - 1 ? ' fill-opacity=".6"' : '') + '/>';
      if ((jours <= 7 || j === max) && j.n > 0) {
        s += '<text x="' + centre + '" y="' + (y - 6) + '" text-anchor="middle" font-size="' + (petit ? 12 : 14) + '" font-weight="700" fill="' + coul + '">' + lkAbrege(j.n) + '</text>';
      }
      const etiquette = jours <= 7 || i % (petit ? 7 : 4) === 0;
      if (etiquette) s += '<text x="' + centre + '" y="' + (bas + FS + 8) + '" text-anchor="middle" font-size="' + FS + '" fill="#e8f6ff">' +
        (jours <= 7 ? lkJourCourt(j.t) : new Date(j.t).getDate() + '/' + (new Date(j.t).getMonth() + 1)) + '</text>';
    });
    survol = serie.map((j, i) => ({ x: xg(j.t + LK_JOUR / 2), texte: lkJourCourt(j.t) + ' : <b style="color:' + coul + '">' + lkNb(j.n) + ' ' + mot + '</b>' + (i === serie.length - 1 ? ' (today, in progress)' : '') }));
  }
  s += '<line x1="' + G + '" x2="' + (W - Dr) + '" y1="' + bas + '" y2="' + bas + '" stroke="rgba(255,255,255,.35)"/>';
  s += '<line class="lk-repere" x1="0" x2="0" y1="' + Hh + '" y2="' + bas + '" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0"/>';
  s += '</svg>';
  graph.innerHTML = s;

  // Summary of the period
  const total = serie.reduce((a, p) => a + p.n, 0);
  const morceaux = ['<span>Total <b>' + lkNb(total) + '</b></span>'];
  if (!barres) {
    const heures = Math.max(1, (Math.min(Date.now(), fin) - debut) / LK_HEURE);
    const parHeure = new Map();
    D0.pts.forEach(p => { const h = Math.floor(p.t / LK_HEURE) * LK_HEURE; parHeure.set(h, (parHeure.get(h) || 0) + p.n); });
    let pireH = null;
    parHeure.forEach((n, t) => { if (!pireH || n > pireH.n) pireH = { t, n }; });
    morceaux.push('<span>Average <b>' + lkNb(total / heures) + '</b> per hour</span>');
    if (pireH && pireH.n > 0) morceaux.push('<span>Busiest hour <b>' + lkNb(pireH.n) + '</b> (' + lkJourCourt(pireH.t) + ', ' + new Date(pireH.t).getHours() + ':00)</span>');
  } else {
    const joursEcoules = Math.max(1, (Date.now() - debut) / LK_JOUR);
    const top = serie.slice().sort((a, b) => b.n - a.n)[0];
    morceaux.push('<span>Average <b>' + lkNb(total / joursEcoules) + '</b> per day</span>');
    if (top && top.n > 0) morceaux.push('<span>Busiest day <b>' + lkNb(top.n) + '</b> (' + lkJourCourt(top.t) + ')</span>');
  }
  if (D0.comp) {
    const [maint, avant] = D0.comp;
    const nom = jours === 1 ? ['Last 24 h', 'Previous 24 h'] : ['Last ' + jours + ' days', 'Previous ' + jours + ' days'];
    let ecart = '';
    if (avant > 0) {
      const pct = Math.round((maint - avant) / avant * 100);
      ecart = ' <span class="' + (pct < 0 ? 'baisse' : pct > 0 ? 'hausse' : '') + '">(' + (pct > 0 ? '+' : pct < 0 ? '−' : '') + Math.abs(pct) + ' %)</span>';
    }
    morceaux.push('<span>' + nom[0] + ' <b>' + lkNb(maint) + '</b> · ' + nom[1] + ' <b>' + lkNb(avant) + '</b>' + ecart + '</span>');
  }
  resume.innerHTML = morceaux.join('');

  // Note: no data at the start of the period (Loki may not keep older data)
  const notes = [];
  if (total === 0) notes.push('No ' + mot + ' over the period.');
  else if (barres) {
    const premier = serie.findIndex(j => j.n > 0);
    if (premier > 0) notes.push('No data before ' + lkJourCourt(serie[premier].t) + ': Loki may not keep older data.');
  }
  if (D0.comp && D0.comp[1] === 0 && D0.comp[0] > 0) notes.push('No comparison possible: nothing in Loki for the period before.');
  notes.push('Read from Loki at ' + new Date(D0.quand).toLocaleTimeString('en-CA') + ', refreshed every 5 min.');
  note.textContent = notes.join(' ');
  info.textContent = 'Slide over the chart to read a value';

  // Reading with a finger or the mouse
  const svg = graph.querySelector('svg');
  const repere = svg.querySelector('.lk-repere');
  const montrer = ev => {
    if (!survol.length) return;
    const r = svg.getBoundingClientRect();
    const cx = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
    let best = survol[0];
    survol.forEach(p => { if (Math.abs(p.x - cx) < Math.abs(best.x - cx)) best = p; });
    repere.setAttribute('x1', best.x); repere.setAttribute('x2', best.x); repere.setAttribute('opacity', '0.8');
    info.innerHTML = best.texte;
  };
  svg.addEventListener('mousemove', montrer);
  svg.addEventListener('touchstart', montrer, { passive: true });
  svg.addEventListener('touchmove', montrer, { passive: true });
}

function majBoutonsHisto(carte) {
  carte.querySelectorAll('.lk-boutons button').forEach(b => b.classList.toggle('actif', Number(b.dataset.jours) === lkJours));
}

function fermerHisto() {
  if (!lkOuverte) return;
  const carte = $('lk-carte-' + lkOuverte);
  if (carte) {
    carte.classList.remove('ouverte');
    carte.setAttribute('aria-expanded', 'false');
    carte.querySelector('.lk-histo').hidden = true;
    carte.querySelector('.lk-indice').textContent = 'Tap for the history';
  }
  lkOuverte = null;
  clearInterval(lkMinuterie);
}

function ouvrirHisto(cle) {
  fermerHisto();
  const carte = $('lk-carte-' + cle);
  if (!carte) return;
  lkOuverte = cle;
  carte.classList.add('ouverte');
  carte.setAttribute('aria-expanded', 'true');
  carte.querySelector('.lk-histo').hidden = false;
  carte.querySelector('.lk-indice').textContent = 'Tap the icon or the title to go back';
  majBoutonsHisto(carte);
  chargerHisto(false);
  lkMinuterie = setInterval(() => { if (!document.hidden) chargerHisto(true); }, LOKI_REFRESH_MS);
}

// A single listener on the section (the cards are created later by loadLoki)
$('loki-cards').addEventListener('click', ev => {
  const carte = ev.target.closest('.carte-lk');
  if (!carte) return;
  const bouton = ev.target.closest('.lk-boutons button');
  if (bouton) {
    lkJours = Number(bouton.dataset.jours);
    majBoutonsHisto(carte);
    chargerHisto(false);
    return;
  }
  if (ev.target.closest('svg')) return;
  if (!carte.classList.contains('ouverte')) { ouvrirHisto(carte.dataset.cle); return; }
  if (ev.target.closest('i, h2, .number, .lk-indice')) fermerHisto();
});
$('loki-cards').addEventListener('keydown', ev => {
  const carte = ev.target.closest('.carte-lk');
  if (!carte || ev.target !== carte || (ev.key !== 'Enter' && ev.key !== ' ')) return;
  ev.preventDefault();
  if (carte.classList.contains('ouverte')) fermerHisto(); else ouvrirHisto(carte.dataset.cle);
});
window.addEventListener('resize', () => { if (lkOuverte && lkDonnees) dessinerHisto(); });



async function loadLoki() {
  try {
    const [wan, syn, snort, h1, scanners, lignes, sigs, ifaces] = await Promise.all([
      lnum(lcount(LFL, LWAN, '24h')),
      lnum(lcount(LFL, LWAN + LSYN, '24h')),
      lnum(lcount(LSN, '', '24h')),
      lnum(lcount(LFL, '', '1h')),
      ltop('topk(' + SURV.maxIp + ', sum by (src) (count_over_time(' + LFL + LWAN + LRE_SYN + ' | src!="" [24h])))', 'src', SURV.maxIp),
      lignesSyn().catch(() => ({ parPort: {}, portsIp: {} })),
      ltop('topk(5, sum by (msg) (count_over_time(' + LSN + LRE_SNORT + ' | msg!="" [24h])))', 'msg', 5),
      ltop('topk(5, sum by (iface) (count_over_time(' + LFL + LRE_IFACE + ' | action="block" [24h])))', 'iface', 5)
    ]);

    const ports = Object.keys(lignes.parPort).map(p => ({ k: p, n: lignes.parPort[p] })).sort((a, b) => b.n - a.n).slice(0, 5);

    // Details of the most active IPs: number of different ports, seen before?
    const portsParIp = {}, avantParIp = {};
    if (scanners.length) {
      const motif = scanners.map(x => x.k.replace(/\./g, '[.]')).join('|');
      const filtre = ' | src=~`' + motif + '`';
      const [av] = await Promise.all([
        ltop('sum by (src) (count_over_time(' + LFL + LWAN + LRE_SYN + ' | src!=""' + filtre + ' [7d] offset 24h))', 'src', SURV.maxIp)
      ]);
      scanners.forEach(x => { if (lignes.portsIp[x.k]) portsParIp[x.k] = lignes.portsIp[x.k].size; });
      av.forEach(x => { avantParIp[x.k] = x.n; });
    }
    const watch = scanners.map(x => {
      const p = portsParIp[x.k] || 0, avant = avantParIp[x.k] || 0, motifs = [];
      if (p >= SURV.ports) motifs.push('scan of ' + p + ' ports');
      if (avant > 0 && x.n >= SURV.recurrente) motifs.push('seen on previous days');
      if (x.n >= SURV.tentatives) motifs.push('very active');
      return { ip: x.k, n: x.n, ports: p, motifs: motifs };
    }).filter(x => x.motifs.length);

    const hw = {};
    ((lastR && lastR.interfaces) || []).forEach(i => { hw[i.hwif] = i.descr || i.name; });

    $('loki-watch').innerHTML = renderWatch(watch);
    const cb = $('copyips');
    if (cb) cb.onclick = () => copyText(watch.map(x => x.ip).join('\n'), cb);

    const actif = h1 > 0;
    majCartesLoki({ wan, syn, snort }, h1);

    $('loki-lists').innerHTML =
      topBox('Most active IPs', 'fa-user-secret', scanners.slice(0, 5), '#ff4d4d', false) +
      topBox('Targeted ports', 'fa-door-open', ports, '#ffc107', false, k => 'Port ' + k) +
      topBox('Snort alerts', 'fa-shield-virus', sigs, '#ffc107', true) +
      topBox('Blocks by interface', 'fa-network-wired', ifaces, '#ff4d4d', false, k => hw[k] || k);

    $('loki-foot').innerHTML =
      '<a class="gbtn" href="' + GRAFANA_URL + '" target="_blank" rel="noopener"><i class="fa-solid fa-chart-line"></i> Open the Grafana dashboard</a>' +
      '<span>Loki data updated at ' + new Date().toLocaleTimeString('en-CA') + ' (every 5 min)</span>';
    lokiOk = true;
  } catch (e) {
    lokiOk = false;
    fermerHisto();
    lkConstruites = false;
    $('loki-watch').innerHTML = '';
    $('loki-cards').innerHTML = '';
    $('loki-lists').innerHTML = '<p class="lokierr"><span class="dot offline-dot"></span>Loki unreachable (' + esc(e.message) +
      '): check the Nginx relay /loki-api/ and the Loki container.</p>';
    $('loki-foot').innerHTML = '';
  }
  renderFirewallZone();
}

async function load() {
  const paths = { system: 'system', gateways: 'gateways', interfaces: 'interfaces', services: 'services', leases: 'dhcp_server/leases', log: 'logs/firewall?limit=500&reverse=true' };
  const R = {};
  await Promise.all(Object.keys(paths).map(async k => {
    try { R[k] = await api(paths[k]); } catch (e) { R[k] = null; if (/HTTP (401|403)/.test(e.message)) R.authError = true; }
  }));
  if (R.authError) {
    clearInterval(timer);
    $('status').className = 'online down';
    $('status').querySelector('span').textContent = 'API key refused: refresh stopped';
    $('updated').textContent = 'Fix the key in Nginx, then reload the page.';
    return;
  }

  const st = $('status');
  if (!R.system && !R.gateways) {
    st.className = 'online down';
    st.querySelector('span').textContent = 'pfSense unreachable';
  } else {
    const gwOk = (R.gateways || []).every(g => g.status === 'online');
    const svcOk = (R.services || []).every(s => s.status === true || s.status === 'running' || !s.enabled);
    const ifOk = (R.interfaces || []).every(i => i.status === 'up');
    const all = gwOk && svcOk && ifOk;
    st.className = 'online' + (all ? '' : ' degraded');
    st.querySelector('span').textContent = all ? 'pfSense operational' : 'pfSense: an item needs attention';
  }

  $('system').innerHTML = systemCards(R.system);
  $('gateways').innerHTML = gatewayCards(R.gateways);
  $('interfaces').innerHTML = interfaceRows(R.interfaces);
  $('services').innerHTML = serviceChips(R.services);
  lastR = R;
  renderFirewallZone();
  $('updated').textContent = 'Last update: ' + new Date().toLocaleTimeString('en-CA');
  if (!lokiStarted) { lokiStarted = true; loadLoki(); setInterval(loadLoki, LOKI_REFRESH_MS); }
  if (!nvmeStarted) { nvmeStarted = true; loadNvme(); setInterval(loadNvme, NVME_REFRESH_MS); }
}

let timer = null;
timer = setInterval(load, REFRESH_MS);
load();
</script>
