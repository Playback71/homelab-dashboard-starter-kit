<script>
const REFRESH_MS = 30000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gb = b => (b / 1073741824).toFixed(1);
const lvl = (v, w, c) => v >= c ? 'crit' : v >= w ? 'warn' : '';

async function api(p) {
  const r = await fetch('/pfs-api/' + p, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return (await r.json()).data;
}

function uptime(s) {
  const m = String(s).match(/(\d+)\s*Day.*?(\d+)\s*Hour/i);
  return m ? m[1] + ' j ' + m[2] + ' h' : String(s);
}

function gauge(icon, title, text, pct, cls, detail) {
  return '<div class="card"><i class="fa-solid ' + icon + '"></i><h2>' + esc(title) + '</h2>' +
    '<div class="number">' + esc(text) + '</div>' +
    '<div class="progress"><span class="' + cls + '" style="width:' + Math.min(100, Math.max(0, pct)) + '%"></span></div>' +
    (detail ? '<p>' + esc(detail) + '</p>' : '') + '</div>';
}

function systemCards(s) {
  if (!s) return '<p>System unavailable.</p>';
  return '<div class="card"><i class="fa-solid fa-shield-halved"></i><h2>pfSense</h2>' +
    '<div class="vm-status"><span class="dot online-dot"></span>ONLINE</div>' +
    '<p>' + esc(s.platform || '') + '</p><p>Uptime: ' + esc(uptime(s.uptime)) + '</p></div>' +
    gauge('fa-microchip', 'CPU', s.cpu_usage.toFixed(0) + '%', s.cpu_usage, lvl(s.cpu_usage, 75, 90), s.cpu_count + ' cores') +
    gauge('fa-memory', 'RAM', s.mem_usage + '%', s.mem_usage, lvl(s.mem_usage, 75, 90), 'Swap: ' + s.swap_usage + '%') +
    gauge('fa-temperature-half', 'TEMPERATURE', s.temp_c + '°C', s.temp_c, lvl(s.temp_c, 65, 75), 'Disk: ' + s.disk_usage + '%') +
    nvmeCard();
}

// ---- NVMe disk: sent every hour to Loki by the script /root/nvme-sante.sh (syslog tag "nvmesante") ----
const NVME_REFRESH_MS = 600000;   // 10 minutes
const NVME_MAX_HEURES = 3;        // older data = cron stopped?
let nvme = null, nvmeErreur = '';

async function loadNvme() {
  try {
    const fin = Date.now() * 1e6, debut = fin - 26 * 3600 * 1e9;
    const url = '/loki-api/loki/api/v1/query_range?query=' + encodeURIComponent('{app="nvmesante"}') +
      '&start=' + debut + '&end=' + fin + '&limit=1&direction=backward';
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const v = (((j.data || {}).result || [])[0] || {}).values;
    if (!v || !v.length) { nvme = null; nvmeErreur = 'no data for 26 h'; }
    else {
      const ligne = String(v[0][1]);
      nvme = JSON.parse(ligne.slice(ligne.indexOf('{')));
      nvme.recu = Number(v[0][0]) / 1e6;
      nvmeErreur = '';
    }
  } catch (e) { nvmeErreur = e.message; }
  if (lastR) $('system').innerHTML = systemCards(lastR.system);
}

function nvmeCard() {
  const tete = '<div class="card"><i class="fa-solid fa-hard-drive"></i><h2>NVMe DISK</h2>';
  if (!nvme) return tete + '<div class="number">--</div><p>' + esc(nvmeErreur ? 'Waiting: ' + nvmeErreur : 'Loading…') + '</p><p>Script nvme-sante.sh on pfSense</p></div>';
  const n = nvme;
  let cls = lvl(n.usure_pct || 0, 70, 90);
  if (n.smart_ok === false || n.erreurs_media > 0 || n.zfs_etat !== 'ONLINE' || (n.reserve_pct !== null && n.reserve_pct <= 20)) cls = 'crit';
  else if (n.temp_c >= 70 && cls !== 'crit') cls = 'warn';
  const vieux = (Date.now() - n.recu) / 3600000 > NVME_MAX_HEURES;
  const lignes = [
    'SMART ' + (n.smart_ok ? 'OK' : 'FAILED') + ' · ' + n.temp_c + ' °C · spare ' + n.reserve_pct + ' %',
    'ZFS ' + n.zfs_etat + ' · ' + n.zfs_utilise + ' / ' + n.zfs_taille + ' (' + n.zfs_pct + ' %)',
    'Written: ' + n.ecrit_to + ' TB · ' + n.erreurs_media + ' error(s)'
  ];
  if (vieux) lignes.unshift('Data from ' + new Date(n.recu).toLocaleString('en-CA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' (cron stopped?)');
  return tete + '<div class="number">' + esc(n.usure_pct) + ' % used</div>' +
    '<div class="progress"><span class="' + (vieux && !cls ? 'warn' : cls) + '" style="width:' + Math.min(100, Math.max(2, n.usure_pct || 0)) + '%"></span></div>' +
    lignes.map(l => '<p>' + esc(l) + '</p>').join('') + '</div>';
}

function gatewayCards(g) {
  if (!g) return '<p>Gateways unavailable.</p>';
  return g.map(x => {
    const ok = x.status === 'online';
    const dot = ok ? (x.loss > 0 ? 'warning-dot' : 'online-dot') : 'offline-dot';
    return '<div class="card"><i class="fa-solid fa-globe"></i><h2>' + esc(x.name) + '</h2>' +
      '<div class="vm-status"><span class="dot ' + dot + '"></span>' + esc(String(x.status).toUpperCase()) + '</div>' +
      '<p>Latency: ' + Number(x.delay).toFixed(1) + ' ms</p><p>Loss: ' + x.loss + ' %</p></div>';
  }).join('');
}

function interfaceRows(list) {
  if (!list) return '<p>Interfaces unavailable.</p>';
  let h = '<div class="row head"><span>Interface</span><span>State</span><span>Received</span><span>Sent</span></div>';
  list.forEach(i => {
    const ok = i.status === 'up';
    h += '<div class="row"><span>' + esc(i.descr || i.name) + '</span>' +
      '<span class="vm-status"><span class="dot ' + (ok ? 'online-dot' : 'offline-dot') + '"></span>' + (ok ? 'UP' : 'DOWN') + '</span>' +
      '<span>' + gb(i.inbytes) + ' GB</span><span>' + gb(i.outbytes) + ' GB</span></div>';
  });
  return h;
}

function serviceChips(list) {
  if (!list) return '<p>Services unavailable.</p>';
  return list.map(s => {
    const ok = s.status === true || s.status === 'running';
    return '<div class="chip"><span class="dot ' + (ok ? 'online-dot' : (s.enabled ? 'offline-dot' : 'warning-dot')) + '"></span>' + esc(s.name) + '</div>';
  }).join('');
}

function firewallPanel(log, ifaces, leases) {
  if (!log) return '<p>Log unavailable.</p>';
  const hw = {};
  (ifaces || []).forEach(i => { hw[i.hwif] = i.descr || i.name; });
  const cnt = {};
  let blocks = 0, total = 0;
  log.forEach(e => {
    const t = String(e.text).split(']: ').pop().split(',');
    if (t.length < 7) return;
    total++;
    if (t[6] !== 'block') return;
    blocks++;
    const n = hw[t[4]] || t[4];
    cnt[n] = (cnt[n] || 0) + 1;
  });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const max = top.length ? top[0][1] : 1;
  let h = '<p>' + blocks + ' blocks in the last ' + total + ' log entries</p>';
  if (log.length) h += '<p>Last entry: ' + esc(String(log[0].text).slice(0, 15)) + '</p>';
  h += top.map(([n, c]) => '<div class="row" style="grid-template-columns:140px 1fr 50px"><span>' + esc(n) +
    '</span><div class="bar"><span style="width:' + Math.round(c / max * 100) + '%"></span></div><span>' + c + '</span></div>').join('');
  if (leases) h += '<p>DHCP leases: ' + leases.length + '</p>';
  return h;
}


// ---- Firewall and Snort read from Loki (Nginx relay /loki-api/, read only) ----
const LOKI_REFRESH_MS = 300000;   // 5 minutes
const GRAFANA_URL = 'http://192.168.100.15:3000/d/pfsense-loki/pfsense-pare-feu-et-snort';   // <- your Grafana dashboard
// Same thresholds as SEUIL in the n8n node check_pfsense_logs (keep them identical)
const SURV = { ports: 15, tentatives: 50, recurrente: 10, maxIp: 30 };
const LFL = '{job="syslog", app="filterlog"}';
const LSN = '{job="syslog", app="snort"}';
const LWAN = ' |= ",igc3,match,block,in,"';
const LSYN = ' |~ ",tcp,[0-9]+,[0-9.]+,[0-9.]+,[0-9]+,[0-9]+,[0-9]+,S,"';
const LRE_SYN = ' | regexp `^(?:[^,]*,){8}4,(?:[^,]*,){7}tcp,[^,]*,(?P<src>[^,]*),[^,]*,[^,]*,(?P<dport>[^,]*),[^,]*,S,`';
const LRE_IFACE = ' | regexp `^(?:[^,]*,){4}(?P<iface>[^,]*),[^,]*,(?P<action>[^,]*),`';
const LRE_SNORT = ' | regexp `\\[[0-9]+:[0-9]+:[0-9]+\\] (?P<msg>.*?) (?:\\[Classification: [^\\]]*\\] )?\\[Priority: [0-9]\\]`';

let lastR = null, lokiOk = false, lokiStarted = false, nvmeStarted = false;

async function lq(expr) {
  const r = await fetch('/loki-api/loki/api/v1/query?query=' + encodeURIComponent(expr), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.status !== 'success') throw new Error('invalid Loki response');
  return j.data.result;
}
// Ports: Loki limits to 500 series per query, so the SYN lines (24 h) are read and counted here
async function lignesSyn() {
  const fin = Date.now() * 1e6, debut = fin - 24 * 3600 * 1e9;
  const q = LFL + LWAN + LSYN;
  const url = '/loki-api/loki/api/v1/query_range?query=' + encodeURIComponent(q) + '&start=' + debut + '&end=' + fin + '&limit=5000&direction=backward';
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.status !== 'success') throw new Error('invalid Loki response');
  const parPort = {}, portsIp = {};
  (j.data.result || []).forEach(f => (f.values || []).forEach(v => {
    const c = String(v[1]).split(',');
    if (c[8] !== '4' || c[16] !== 'tcp' || !c[18] || !c[21]) return;
    parPort[c[21]] = (parPort[c[21]] || 0) + 1;
    (portsIp[c[18]] = portsIp[c[18]] || new Set()).add(c[21]);
  }));
  return { parPort, portsIp };
}
const lcount = (sel, filt, win) => 'sum(count_over_time(' + sel + filt + ' [' + win + '])) or vector(0)';
async function lnum(expr) {
  const r = await lq(expr);
  return r.length ? Math.round(Number(r[0].value[1])) : 0;
}
async function ltop(expr, key, max) {
  const r = await lq(expr);
  return r.filter(x => x.metric && x.metric[key])
    .map(x => ({ k: x.metric[key], n: Math.round(Number(x.value[1])) }))
    .sort((a, b) => b.n - a.n).slice(0, max || 5);
}

function statCard(icon, title, value, sub) {
  return '<div class="card"><i class="fa-solid ' + icon + '"></i><h2>' + esc(title) + '</h2>' +
    '<div class="number">' + value.toLocaleString('en-CA') + '</div><p>' + esc(sub) + '</p></div>';
}

function topBox(title, icon, items, color, wide, label) {
  const max = items.length ? items[0].n : 1;
  const rows = items.length
    ? items.map(it => '<div class="trow' + (wide ? ' wide' : '') + '"><span class="tlabel" title="' + esc(it.k) + '">' +
        esc(label ? label(it.k) : it.k) + '</span><div class="bar"><span style="width:' + Math.max(4, Math.round(it.n / max * 100)) +
        '%;background:' + color + '"></span></div><span class="tcount">' + it.n.toLocaleString('en-CA') + '</span></div>').join('')
    : '<p class="tempty">No data over 24 h</p>';
  return '<div class="tbox"><h3><i class="fa-solid ' + icon + '"></i>' + esc(title) + '</h3>' + rows + '</div>';
}

function copyText(text, btn) {
  const done = () => {
    const old = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
    setTimeout(() => { btn.innerHTML = old; }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); return; }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* copy not possible */ }
  document.body.removeChild(ta);
}

function renderWatch(list) {
  if (!list.length) {
    return '<div class="watchbox ok"><div class="watchhead"><i class="fa-solid fa-shield-halved"></i><h3>Attacks to watch</h3></div>' +
      '<p class="watchsum">No external IP to watch over 24 h.</p></div>';
  }
  list.sort((a, b) => b.ports - a.ports || b.n - a.n);
  const best = list[0];
  const quoi = best.ports >= SURV.ports ? 'scanning ' + best.ports + ' different ports' : 'with ' + best.n + ' attempts';
  const sum = list.length + ' external IP' + (list.length > 1 ? 's' : '') + ' to watch, including ' + best.ip + ' ' + quoi + '.';
  const rows = list.map(x => {
    const url = 'https://www.abuseipdb.com/check/' + encodeURIComponent(x.ip);
    return '<div class="wrow"><span class="wip">' + esc(x.ip) + '</span><span>' + x.n + ' attempts</span><span>' + x.ports + ' ports</span>' +
      '<span class="wwhy" title="' + esc(x.motifs.join(' · ')) + '">' + esc(x.motifs.join(' · ')) + '</span>' +
      '<a class="wlink" href="' + url + '" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> AbuseIPDB</a></div>';
  }).join('');
  return '<div class="watchbox"><div class="watchhead"><i class="fa-solid fa-user-secret"></i><h3>Attacks to watch</h3>' +
    '<button class="gbtn wbtn" id="copyips" type="button"><i class="fa-regular fa-copy"></i> Copy the IPs</button></div>' +
    '<p class="watchsum">' + esc(sum) + '</p>' +
    '<div class="wtable"><div class="wrow whead"><span>IP address</span><span>Attempts</span><span>Ports</span><span>Why</span><span>Check</span></div>' + rows + '</div></div>';
}

function renderFirewallZone() {
  if (!lastR) return;
  $('firewall').innerHTML = lokiOk
    ? (lastR.leases ? '<p>DHCP leases: ' + lastR.leases.length + '</p>' : '')
    : firewallPanel(lastR.log, lastR.interfaces, lastR.leases);
}

async function loadLoki() {
  try {
    const [wan, syn, snort, h1, scanners, lignes, sigs, ifaces] = await Promise.all([
      lnum(lcount(LFL, LWAN, '24h')),
      lnum(lcount(LFL, LWAN + LSYN, '24h')),
      lnum(lcount(LSN, '', '24h')),
      lnum(lcount(LFL, '', '1h')),
      ltop('topk(' + SURV.maxIp + ', sum by (src) (count_over_time(' + LFL + LWAN + LRE_SYN + ' | src!="" [24h])))', 'src', SURV.maxIp),
      lignesSyn().catch(() => ({ parPort: {}, portsIp: {} })),
      ltop('topk(5, sum by (msg) (count_over_time(' + LSN + LRE_SNORT + ' | msg!="" [24h])))', 'msg', 5),
      ltop('topk(5, sum by (iface) (count_over_time(' + LFL + LRE_IFACE + ' | action="block" [24h])))', 'iface', 5)
    ]);

    const ports = Object.keys(lignes.parPort).map(p => ({ k: p, n: lignes.parPort[p] })).sort((a, b) => b.n - a.n).slice(0, 5);

    // Details of the most active IPs: number of different ports, seen before?
    const portsParIp = {}, avantParIp = {};
    if (scanners.length) {
      const motif = scanners.map(x => x.k.replace(/\./g, '[.]')).join('|');
      const filtre = ' | src=~`' + motif + '`';
      const [av] = await Promise.all([
        ltop('sum by (src) (count_over_time(' + LFL + LWAN + LRE_SYN + ' | src!=""' + filtre + ' [7d] offset 24h))', 'src', SURV.maxIp)
      ]);
      scanners.forEach(x => { if (lignes.portsIp[x.k]) portsParIp[x.k] = lignes.portsIp[x.k].size; });
      av.forEach(x => { avantParIp[x.k] = x.n; });
    }
    const watch = scanners.map(x => {
      const p = portsParIp[x.k] || 0, avant = avantParIp[x.k] || 0, motifs = [];
      if (p >= SURV.ports) motifs.push('scan of ' + p + ' ports');
      if (avant > 0 && x.n >= SURV.recurrente) motifs.push('seen on previous days');
      if (x.n >= SURV.tentatives) motifs.push('very active');
      return { ip: x.k, n: x.n, ports: p, motifs: motifs };
    }).filter(x => x.motifs.length);

    const hw = {};
    ((lastR && lastR.interfaces) || []).forEach(i => { hw[i.hwif] = i.descr || i.name; });

    $('loki-watch').innerHTML = renderWatch(watch);
    const cb = $('copyips');
    if (cb) cb.onclick = () => copyText(watch.map(x => x.ip).join('\n'), cb);

    const actif = h1 > 0;
    $('loki-cards').innerHTML =
      statCard('fa-ban', 'WAN blocks', wan, 'blocked incoming connections') +
      statCard('fa-magnifying-glass', 'SYN scans', syn, 'TCP probes on the WAN') +
      statCard('fa-triangle-exclamation', 'Snort alerts', snort, 'over 24 hours') +
      '<div class="card"><i class="fa-solid fa-database"></i><h2>Log reception</h2>' +
      '<div class="vm-status"><span class="dot ' + (actif ? 'online-dot' : 'offline-dot') + '"></span>' + (actif ? 'ACTIVE' : 'STOPPED') + '</div>' +
      '<p>' + h1.toLocaleString('en-CA') + ' logs in the last hour</p></div>';

    $('loki-lists').innerHTML =
      topBox('Most active IPs', 'fa-user-secret', scanners.slice(0, 5), '#ff4d4d', false) +
      topBox('Targeted ports', 'fa-door-open', ports, '#ffc107', false, k => 'Port ' + k) +
      topBox('Snort alerts', 'fa-shield-virus', sigs, '#ffc107', true) +
      topBox('Blocks by interface', 'fa-network-wired', ifaces, '#ff4d4d', false, k => hw[k] || k);

    $('loki-foot').innerHTML =
      '<a class="gbtn" href="' + GRAFANA_URL + '" target="_blank" rel="noopener"><i class="fa-solid fa-chart-line"></i> Open the Grafana dashboard</a>' +
      '<span>Loki data updated at ' + new Date().toLocaleTimeString('en-CA') + ' (every 5 min)</span>';
    lokiOk = true;
  } catch (e) {
    lokiOk = false;
    $('loki-watch').innerHTML = '';
    $('loki-cards').innerHTML = '';
    $('loki-lists').innerHTML = '<p class="lokierr"><span class="dot offline-dot"></span>Loki unreachable (' + esc(e.message) +
      '): check the Nginx relay /loki-api/ and the Loki container.</p>';
    $('loki-foot').innerHTML = '';
  }
  renderFirewallZone();
}

async function load() {
  const paths = { system: 'system', gateways: 'gateways', interfaces: 'interfaces', services: 'services', leases: 'dhcp_server/leases', log: 'logs/firewall?limit=500&reverse=true' };
  const R = {};
  await Promise.all(Object.keys(paths).map(async k => {
    try { R[k] = await api(paths[k]); } catch (e) { R[k] = null; if (/HTTP (401|403)/.test(e.message)) R.authError = true; }
  }));
  if (R.authError) {
    clearInterval(timer);
    $('status').className = 'online down';
    $('status').querySelector('span').textContent = 'API key refused: refresh stopped';
    $('updated').textContent = 'Fix the key in Nginx, then reload the page.';
    return;
  }

  const st = $('status');
  if (!R.system && !R.gateways) {
    st.className = 'online down';
    st.querySelector('span').textContent = 'pfSense unreachable';
  } else {
    const gwOk = (R.gateways || []).every(g => g.status === 'online');
    const svcOk = (R.services || []).every(s => s.status === true || s.status === 'running' || !s.enabled);
    const ifOk = (R.interfaces || []).every(i => i.status === 'up');
    const all = gwOk && svcOk && ifOk;
    st.className = 'online' + (all ? '' : ' degraded');
    st.querySelector('span').textContent = all ? 'pfSense operational' : 'pfSense: an item needs attention';
  }

  $('system').innerHTML = systemCards(R.system);
  $('gateways').innerHTML = gatewayCards(R.gateways);
  $('interfaces').innerHTML = interfaceRows(R.interfaces);
  $('services').innerHTML = serviceChips(R.services);
  lastR = R;
  renderFirewallZone();
  $('updated').textContent = 'Last update: ' + new Date().toLocaleTimeString('en-CA');
  if (!lokiStarted) { lokiStarted = true; loadLoki(); setInterval(loadLoki, LOKI_REFRESH_MS); }
  if (!nvmeStarted) { nvmeStarted = true; loadNvme(); setInterval(loadNvme, NVME_REFRESH_MS); }
}

let timer = null;
timer = setInterval(load, REFRESH_MS);
load();
</script>
<script src="./js/clock.js"></script>
<script src="./js/fit-page.js"></script>
</body>
