# default.conf : v2026.11.17-4 : EXAMPLE Nginx config for the MY HOMELAB dashboard (starter kit)
#
# Nginx serves the pages AND works as a RELAY (reverse proxy) to each device API.
# The browser only talks to Nginx: API keys stay here, never in the web pages.
#
# Before using it:
#   - replace every 192.168.100.x address (they are fictional examples) with YOUR device addresses;
#   - replace every A_REMPLIR (= "to fill in") with your own key or token;
#   - delete the blocks of devices you do not have (the matching card just shows "unavailable").
# This file is mounted as a single file in the container: edit it IN PLACE, then
#   docker restart dashboard-web
# Test the config without restarting: docker exec dashboard-web nginx -t
#
# Example addresses used below (change them):
#   192.168.100.1   pfSense firewall          192.168.100.10  NAS (TrueNAS) + Uptime Kuma
#   192.168.100.11  Synology NAS              192.168.100.12  Proxmox node 1
#   192.168.100.13  Proxmox node 2            192.168.100.14  n8n
#   192.168.100.15  Loki                      192.168.100.16  Ollama PC (GPU)
#   192.168.100.17  Home Assistant            192.168.100.18  UniFi UNVR (Protect)

server {
    charset utf-8;
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Documentation page: list of files in /documents/ (JSON) and VERSIONS.txt
    location /documents/ {
        autoindex on;
        autoindex_format json;
    }

    # ---------- Proxmox (proxmox.html, journal.html) : one block per node, read only ----------
    # Token: Datacenter, Permissions, API Tokens. Give it the PVEAuditor role (read only).
    # Format: PVEAPIToken=USER@REALM!TOKENID=SECRET
    location /pve/proxmox1/ {
        if ($http_cf_connecting_ip) { return 403; }   # refuse requests coming through a Cloudflare tunnel
        limit_except GET { deny all; }
        proxy_pass https://192.168.100.12:8006/api2/json/;
        proxy_ssl_verify off;
        proxy_set_header Authorization "PVEAPIToken=A_REMPLIR";
    }
    location /pve/proxmox2/ {
        if ($http_cf_connecting_ip) { return 403; }
        limit_except GET { deny all; }
        proxy_pass https://192.168.100.13:8006/api2/json/;
        proxy_ssl_verify off;
        proxy_set_header Authorization "PVEAPIToken=A_REMPLIR";
    }

    # ---------- Glances (index.html, journal.html) : CPU, RAM, network, disks, containers ----------
    location /glances-truenas/ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.10:61208/;
    }
    location /glances-syno/ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.11:61208/;
    }

    # ---------- Synology health file (index.html, Disks and Backups cards) ----------
    # A small web server on the Synology serves synology-sante.json (written by a script).
    location /syno-status/ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.11:8088/;
    }

    # ---------- Uptime Kuma (every page) : public status page "homelab", no key needed ----------
    location /kuma-api/ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.10:3001/;
    }

    # ---------- Home Assistant (optional; supervision.html can also call it directly) ----------
    location /ha-api/ {
        proxy_pass http://192.168.100.17:8123/;
    }

    # ---------- pfSense REST API package (pfsense.html, NOC cards) : status only, read only ----------
    location /pfs-api/ {
        limit_except GET { deny all; }
        proxy_pass https://192.168.100.1:443/api/v2/status/;
        proxy_ssl_verify off;
        proxy_set_header X-API-Key "A_REMPLIR";
    }

    # ---------- UniFi Protect on the UNVR (supervision.html : cameras and alarm) ----------
    # Key: UniFi OS, Settings, Control Plane, Integrations, API key.
    location = /unvr-api/cameras {
        limit_except GET { deny all; }
        proxy_pass https://192.168.100.18/proxy/protect/integration/v1/cameras;
        proxy_ssl_verify off;
        proxy_set_header X-API-Key "A_REMPLIR";
    }
    location = /unvr-api/nvrs {
        limit_except GET { deny all; }
        proxy_pass https://192.168.100.18/proxy/protect/integration/v1/nvrs;
        proxy_ssl_verify off;
        proxy_set_header X-API-Key "A_REMPLIR";
    }

    # ---------- n8n webhooks ----------
    # Morning report (journal.html) : workflow "Rapport-matin". Put the path of YOUR webhook node.
    location = /rapport-matin/ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.14:5678/webhook/rapport-matin;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    # "Run the Workflow" button (journal.html) : webhook "lancer-scan" of Verifier system
    location = /lancer-scan {
        limit_except POST { deny all; }
        proxy_pass http://192.168.100.14:5678/webhook/lancer-scan;
        proxy_read_timeout 15s;
    }
    # External access card (index.html) : workflow "Statut tunnels et VPN"
    location = /n8n-tunnels/ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.14:5678/webhook/statut-tunnels;
        proxy_read_timeout 30s;
    }
    # 30-day outage log (reseau.html) : workflow "Journal des pannes"
    location = /journal-pannes/ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.14:5678/webhook/journal-pannes;
        proxy_read_timeout 15s;
    }

    # ---------- Ollama PC (supervision.html) ----------
    # gpu-stats: small service on the GPU PC that returns nvidia-smi as JSON (ask Claude for it).
    location = /gpu-api/ {
        proxy_pass http://192.168.100.16:9835/;
        proxy_read_timeout 10s;
    }
    # Ollama API: ONLY 3 read-only routes. Never relay the whole API (it has no password).
    location ~ ^/ollama-api/(tags|ps|version)$ {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.16:11434/api/$1;
        proxy_read_timeout 10s;
    }

    # ---------- Loki (pfsense.html : firewall and Snort) : read only, 2 routes ----------
    location = /loki-api/loki/api/v1/query {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.15:3100/loki/api/v1/query;
        proxy_read_timeout 60s;
    }
    location = /loki-api/loki/api/v1/query_range {
        limit_except GET { deny all; }
        proxy_pass http://192.168.100.15:3100/loki/api/v1/query_range;
        proxy_read_timeout 60s;
    }
}

