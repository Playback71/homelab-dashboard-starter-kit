<script>
const DOCS_URL = '/documents/';

function iconForFile(name) {
    const ext = name.split('.').pop().toLowerCase();
    const icons = {
        pdf: '📄',
        xlsx: '📊',
        xls: '📊',
        csv: '📊',
        doc: '📝',
        docx: '📝',
        txt: '📃',
        zip: '🗜️',
        png: '🖼️',
        jpg: '🖼️',
        jpeg: '🖼️'
    };
    return icons[ext] || '📁';
}

async function loadDocuments() {
    try {
        const res = await fetch(DOCS_URL, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('Loading error');
        const files = await res.json();

        const list = files
            .filter(f => f.type === 'file')
            .sort((a, b) => a.name.localeCompare(b.name));

        const container = document.getElementById('docs-list');

        if (list.length === 0) {
            container.innerHTML = '<p>No document found.</p>';
            return;
        }

        container.innerHTML = list.map(f => `
            <p>
                <a href="${DOCS_URL}${encodeURIComponent(f.name)}" target="_blank">
                    ${iconForFile(f.name)} ${f.name}
                </a>
            </p>
        `).join('');
    } catch (err) {
        document.getElementById('docs-list').innerHTML = '<p>Unable to load the document list.</p>';
        console.error(err);
    }
}

loadDocuments();
setInterval(loadDocuments, 15000); // refresh every 15 seconds

// ---------- Version log: /documents/VERSIONS.txt ----------
// An entry starts with a line "YYYY-MM-DD  vYYYY.MM.DD-N" followed by a line of dashes.
// The systems involved are recognized by words in the text of the entry.
const VERSIONS_URL = '/documents/VERSIONS.txt';
const SYSTEMES = [
    ['n8n', /n8n/i],
    ['Site', /^Site\b|\.html|sante\.js|site-web/im],
    ['TrueNAS', /truenas/i],
    ['Synology', /synology/i],
    ['pfSense', /pfsense/i],
    ['Proxmox', /proxmox/i],
    ['UniFi', /unifi/i],
    ['Home Assistant', /home assistant/i],
    ['Uptime Kuma', /kuma/i],
    ['Grafana / Loki', /grafana|loki/i]
];
let vEntrees = [], vFiltre = 'All', vTexteBrut = '';
const vEsc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function vAnalyser(txt) {
    const lignes = txt.replace(/\r/g, '').split('\n');
    const entrees = [];
    let cur = null;
    for (let i = 0; i < lignes.length; i++) {
        const m = lignes[i].match(/^(\d{4}-\d{2}-\d{2})\s+(v[\d.]+-\d+)\s*$/);
        if (m && /^-{5,}\s*$/.test(lignes[i + 1] || '')) {
            if (cur) entrees.push(cur);
            cur = { date: m[1], version: m[2], corps: [] };
            i++;   // skip the line of dashes
            continue;
        }
        if (cur) cur.corps.push(lignes[i]);
    }
    if (cur) entrees.push(cur);
    entrees.forEach(e => {
        e.texte = e.corps.join('\n').replace(/\s+$/, '');
        e.systemes = SYSTEMES.filter(([, re]) => re.test(e.texte)).map(([nom]) => nom);
    });
    return entrees;
}

function vJour(d) {
    const t = new Date(d + 'T12:00:00');
    return isNaN(t) ? d : t.toLocaleDateString('en-CA', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
}

function vAfficher() {
    const q = (document.getElementById('vrecherche') || {}).value || '';
    const qn = q.trim().toLowerCase();
    const liste = vEntrees.filter(e =>
        (vFiltre === 'All' || e.systemes.includes(vFiltre)) &&
        (!qn || (e.version + ' ' + e.date + ' ' + e.texte).toLowerCase().includes(qn)));
    const surligner = s => {
        let h = vEsc(s);
        if (qn) {
            const re = new RegExp(qn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'), 'gi');
            h = h.replace(re, x => '<mark>' + x + '</mark>');
        }
        return h;
    };
    document.getElementById('versions-info').textContent =
        liste.length + ' change(s) out of ' + vEntrees.length +
        (vFiltre !== 'All' ? ' : ' + vFiltre : '') + (qn ? ' : "' + q.trim() + '"' : '');
    document.getElementById('versions-list').innerHTML = liste.map(e => `
        <div class="ventree">
            <h3><span class="vdate">${vEsc(vJour(e.date))}</span> ${surligner(e.version)}
                ${e.systemes.map(s => '<span class="vtag">' + vEsc(s) + '</span>').join('')}</h3>
            <pre>${surligner(e.texte)}</pre>
        </div>`).join('') || '<p>No change matches.</p>';
}

function vFiltres() {
    const box = document.getElementById('versions-filtres');
    const compte = nom => nom === 'All' ? vEntrees.length : vEntrees.filter(e => e.systemes.includes(nom)).length;
    const noms = ['All'].concat(SYSTEMES.map(([n]) => n).filter(n => compte(n) > 0));
    if (!noms.includes(vFiltre)) vFiltre = 'All';
    const ancienne = (document.getElementById('vrecherche') || {}).value || '';
    box.innerHTML = noms.map(n =>
        `<button class="vchip${n === vFiltre ? ' actif' : ''}" data-sys="${vEsc(n)}">${vEsc(n)}<b>${compte(n)}</b></button>`).join('') +
        `<input id="vrecherche" type="search" placeholder="Search (node, file, version...)" value="${vEsc(ancienne)}">`;
    box.querySelectorAll('.vchip').forEach(b => b.addEventListener('click', () => {
        vFiltre = b.dataset.sys;
        box.querySelectorAll('.vchip').forEach(x => x.classList.toggle('actif', x === b));
        vAfficher();
    }));
    document.getElementById('vrecherche').addEventListener('input', vAfficher);
}

async function loadVersions() {
    try {
        const r = await fetch(VERSIONS_URL, { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const txt = await r.text();
        if (txt === vTexteBrut) return;   // nothing new: keep the filter, the search and the position
        vTexteBrut = txt;
        vEntrees = vAnalyser(txt);
        vFiltres();
        vAfficher();
    } catch (e) {
        document.getElementById('versions-info').textContent = 'Unable to read VERSIONS.txt (' + e.message + ').';
        console.error(e);
    }
}
loadVersions();
setInterval(loadVersions, 60000);   // check every minute if VERSIONS.txt has changed
</script>
